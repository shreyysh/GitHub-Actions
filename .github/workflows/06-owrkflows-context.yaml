name: 006-workflow-context
run-name: 06-Context | DEBUG - ${{inputs.debug}}
on: 
    push:
    workflow_dispatch:
        inputs:
            debug:
                type: boolean
                default: false
env :
    MY_WORKFLOW : 'workflow'
    OVERWRITTEN_VAR : 'workflow'
jobs:
    wokflow-context-job:
        runs-on: ubuntu-latest
        env :
            MY_WORKFLOW : 'jobs'
            OVERWRITTEN_VAR : 'jobs'
        steps :
            - name: context-job
              run: |
                echo "Event Name: ${{github.env}}"
                echo "Ref ${{github.ref}}"
                echo "Workflow ${{github.workflow}}"
                echo "Run id ${{github.run_id}}"
                echo "Run attempt ${{github.run_attempt}}"
                echo "Run attempt ${{github.workflow}}"
            - name: retrieve variable
              run: |
                echo "Variable Name: ${{vars.my_secret}}"
            - name: retrieve env variable
              env : 
                OVERWRITTEN_VAR : 'steps'
              run: |
                echo "Variable Name: ${{env.MY_WORKFLOW}}"
                echo "Variable Name: ${{env.OVERWRITTEN_VAR}}"