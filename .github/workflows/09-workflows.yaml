name: 009-workflows-execution-flow
on:
    push:
    workflow_dispatch:
        inputs:
            deploy-image:
                type: boolean
                description : Whether to deploy image or not
                default : true
jobs:
    clone-job:
        runs-on: ubuntu-latest
        steps:
            - name: clone-step
              run: |
                echo "Cloning repo"
                ls
    docker-build-job:
        runs-on: ubuntu-latest
        needs: clone-job
        steps:
            - name: build-step
              run: |
                echo "Docker build is in progress"
                echo "Docker image build completed"
    image-push-job:
        runs-on: ubuntu-latest
        needs: 
            - docker-build-job
        steps:
            - name: image-push-step
              run: |
                echo "Pushing image to ECR"
    deployment-job:
        runs-on: ubuntu-latest
        needs: 
            - docker-build-job
            - image-push-job
        steps:
            - name: deployment-step
              if: ${{ inputs.deploy-image}}
              run: |
                echo "Deploying latest image"
            - name: deployment-failed
              if: ${{ !inputs.deploy-image}}
              run: exit 1
    notification-job:
        runs-on: ubuntu-latest
        needs: 
            - image-push-job
            - deployment-job
        steps:
            - name: Notification-on-success
              if: success()
              run: |
                echo "Notifying user build was success"
            - name: Notification-on-cancelled
              if: cancelled()
              run: |
                echo "Notifying user build was cancelled"
