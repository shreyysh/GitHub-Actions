name : 13-workflow-artifacts
on:
    workflow_dispatch
jobs :
    clone-job:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: 04-using-actions/react-app
        steps:
            - name: git_clone_stage
              uses: actions/checkout@v4
            - name: Setup node
              uses: actions/setup-node@v4
              with:
                node-version: '20.x'
                cache: 'npm'
                cache-dependency-path: 04-using-actions/react-app/package-lock.json
            - name: npm_build
              run: npm run build
            - name: Upload-artifacts
              uses: actions/upload-artifact@v4
              with:
                name: app ## artifacts name
                path: 04-using-actions/react-app/build
    deploy_job:
        runs-on: ubuntu-latest
        needs: clone-job
        steps:
            - name: download-artifacts
              uses: actions/download-artifact@v4
              with:
                name: app
                path: build
            - name: show downloaded artifacts files
              run: ls -R

