name: 007-workflow-expression
run-name: 007-workflow-expression | Debug - ${{inputs.debugn && 'ON' || 'OFF'}}
on:
    push:
    workflow_dispatch:
        inputs:
            debug:
                type: boolean
                default: false
jobs:
    workflow-job:
        runs-on: ubuntu-latest
        steps:
            - name: first-expression-usecasae
            #first expression if conditon
              if: ${{ inputs.debug }}  
              run: |
                echo "Event Name: ${{github.event}}"
                echo "Branch Name: ${{github.ref}}"
                echo "Commit  SHA: ${{github.sha}}"
                echo "OS Name: ${{runner.os}}"
            - name: Second-expression-debug
            #second expression if conditon
              if: ${{inputs.debug && github.ref == 'refs/heads/dev'}}
              run: echo "Step 2 has been executed"
            - name: Else condition
              run: echo "Code has been executed in else condition"
